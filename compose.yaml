services:
  postgres:
    image: postgres:17
    container_name: jobhunterai-postgres
    environment:
      POSTGRES_DB: jobhunterai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - jobhunterai_postgres_data:/var/lib/postgresql/data

volumes:
  jobhunterai_postgres_data: